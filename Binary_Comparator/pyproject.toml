[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "firmware-binary-tool"
version = "1.0.0"
description = "Firmware Binary Comparison Tool - compare .bin / Intel HEX / ELF firmware images by MCU address"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dnd = ["tkinterdnd2>=0.3.0"]
dev = ["pyinstaller>=6.0", "pytest>=7.0"]

[project.scripts]
firmware-diff = "firmware_binary_tool.cli.cli:main_entry"

[project.gui-scripts]
firmware-diff-gui = "firmware_binary_tool.main:main"

[tool.setuptools.packages.find]
include = ["firmware_binary_tool*"]

[tool.setuptools.package-data]
firmware_binary_tool = ["config/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
